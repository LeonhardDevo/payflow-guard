; Production PHP settings for the web image (loaded after php.ini-production).
expose_php = Off
memory_limit = 256M
max_execution_time = 60
date.timezone = UTC

; Knowledge-base uploads (worker RAG_MAX_FILE_MB defaults to 50).
upload_max_filesize = 50M
post_max_size = 52M
max_file_uploads = 10

; OPcache: code is immutable inside the image.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.save_comments = 1

realpath_cache_size = 4096K
realpath_cache_ttl = 600

; Errors go to stderr (container logs), never to the client.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
